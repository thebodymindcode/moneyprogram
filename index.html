<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef1f5" />
  <title>Протокол денег</title>
  <meta name="description" content="Твоя программа на 17 дней. Старт 1 июля, 20 минут в день." />

  <!-- Иконка приложения и установка на экран (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Протокол денег" />
  <script>
    // ловим системное приглашение установки (Android/Chrome), кнопка вызовет его в один тап
    window.__bip = null;
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });
    window.addEventListener("appinstalled", function () { window.__bip = null; });
  </script>

  <!-- Превью ссылки в мессенджерах (Open Graph + Twitter).
       Дата старта «1 июля» должна совпадать с START_DATE в appConfig.js. -->

  <meta property="og:url" content="https://thebodymindcode.github.io/moneyprogram/" />
  <meta property="og:title" content="Протокол денег" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:locale" content="ru_RU" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Протокол денег" />
  <meta name="twitter:description" content="Твоя программа на 17 дней. Старт 1 июля, 20 минут в день." />
  <meta name="twitter:image" content="https://thebodymindcode.github.io/moneyprogram/og-cover.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
