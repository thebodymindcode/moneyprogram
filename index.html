<body>
  <script>
    // подсказка открыть в обычном браузере, если зашли через встроенный браузер Telegram (он подвешивает веб-приложения)
    (function () {
      try {
        var ua = navigator.userAgent || "";
        var tg = !!(window.TelegramWebviewProxy || window.TelegramWebview || (window.external && window.external.notify) || /Telegram/i.test(ua));
        if (!tg) return;
        if (sessionStorage.getItem("tg-hint-closed")) return;
        var isAndroid = /Android/i.test(ua);
        var browser = isAndroid ? "Chrome" : "Safari";
        var dots = isAndroid ? "&#8942;" : "&bull;&bull;&bull;";   // на андроиде меню это ⋮, на айфоне •••
        var bar = document.createElement("div");
        bar.style.cssText = "background:#1d2733;color:#fff;font:600 13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:12px 14px;display:flex;align-items:flex-start;gap:10px";
        var t = document.createElement("span");
        t.style.cssText = "flex:1";
        t.innerHTML = "Лучше открыть в обычном браузере, тут страница может зависать. Нажмите &laquo;" + dots + "&raquo; вверху справа и &laquo;Открыть в " + browser + "&raquo;.";
        var x = document.createElement("span");
        x.textContent = "✕";
        x.style.cssText = "cursor:pointer;font-weight:800;padding:0 4px;opacity:.8";
        x.onclick = function () { bar.remove(); try { sessionStorage.setItem("tg-hint-closed", "1"); } catch (e) {} };
        bar.appendChild(t); bar.appendChild(x);
        document.body.insertBefore(bar, document.body.firstChild);
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="appConfig.js?v=383daee1"></script>
  <script src="supabaseClient.js"></script>
  <!-- app.js собирается из app.jsx скриптом build.py (Babel больше не грузится в браузере) -->
  <script src="app.js?v=abab26c7"></script>
  <!-- сервис-воркер: сеть в приоритете, чтобы обновления приходили сразу и работал офлайн -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
